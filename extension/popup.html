<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px/1.5 system-ui, sans-serif;
        margin: 0;
        min-width: 16rem;
        padding: 0.75rem 1rem;
      }

      p {
        margin: 0;
      }

      #kept {
        color: #57606a;
      }

      #actions {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      button {
        font: inherit;
      }

      #settings {
        margin-top: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div id="actions">
      <button id="save" type="button"></button>
      <button id="cv" type="button"></button>
      <button id="cover-letter" type="button"></button>
    </div>
    <p id="outcome" hidden></p>
    <p id="kept" hidden></p>
    <button id="settings" type="button" hidden></button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
