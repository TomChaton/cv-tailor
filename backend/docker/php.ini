; Production-shaped defaults for every role running this image.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.memory_consumption=128

memory_limit=512M
expose_php=0

; Errors go to the container's stderr, never to the HTTP response.
display_errors=0
log_errors=1
error_log=/dev/stderr
